<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Remote Jobs MCP architecture</title>
  <desc id="description">An MCP client sends a bearer access key to the Remote Jobs MCP, which forwards authorized requests to the job search API.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182d"/>
      <stop offset="1" stop-color="#0c2940"/>
    </linearGradient>
    <linearGradient id="mcp-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123e55"/>
      <stop offset="1" stop-color="#0e3047"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020817" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#8bd8d1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#background)"/>
  <rect width="1600" height="760" rx="28" fill="url(#grid)"/>

  <circle cx="1450" cy="80" r="170" fill="#1db6a5" opacity="0.08"/>
  <circle cx="1500" cy="35" r="90" fill="#f3b562" opacity="0.08"/>

  <text x="82" y="82" fill="#75ddd2" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4">REMOTE JOBS / MCP</text>
  <text x="82" y="145" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">A secure bridge to the job board</text>
  <text x="82" y="184" fill="#b8cede" font-family="Arial, Helvetica, sans-serif" font-size="22">Search public job data, inspect descriptions, and unlock application links only when allowed.</text>

  <g filter="url(#shadow)">
    <rect x="82" y="260" width="360" height="254" rx="22" fill="#f6fbff"/>
    <rect x="82" y="260" width="8" height="254" rx="4" fill="#1db6a5"/>
    <circle cx="137" cy="318" r="25" fill="#d8f5f0"/>
    <path d="M126 319h22M137 308v22M130 311l14 14M144 311l-14 14" stroke="#087f78" stroke-width="4" stroke-linecap="round"/>
    <text x="180" y="311" fill="#087f78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">MCP CLIENT</text>
    <text x="118" y="371" fill="#09233d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Claude, Cursor, or any</text>
    <text x="118" y="404" fill="#09233d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">compatible agent</text>
    <text x="118" y="452" fill="#46627d" font-family="Arial, Helvetica, sans-serif" font-size="18">Bearer API key stays in</text>
    <text x="118" y="478" fill="#46627d" font-family="Arial, Helvetica, sans-serif" font-size="18">the client's secret store</text>
  </g>

  <g>
    <path d="M470 387h108" stroke="#63d5ca" stroke-width="4" stroke-linecap="round"/>
    <path d="m560 371 20 16-20 16" fill="none" stroke="#63d5ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="498" y="357" fill="#8fded7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">JSON-RPC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="236" width="400" height="302" rx="24" fill="url(#mcp-card)" stroke="#31c8b8" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="600" y="236" width="400" height="8" rx="4" fill="#31c8b8"/>
    <circle cx="665" cy="307" r="29" fill="#b7eee8"/>
    <path d="M650 307h30M665 292v30" stroke="#087f78" stroke-width="5" stroke-linecap="round"/>
    <text x="715" y="302" fill="#75ddd2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">REMOTE JOBS MCP</text>
    <text x="650" y="366" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Thin protocol adapter</text>
    <text x="650" y="410" fill="#bad3df" font-family="Arial, Helvetica, sans-serif" font-size="18">Validates tools, forwards the bearer,</text>
    <text x="650" y="438" fill="#bad3df" font-family="Arial, Helvetica, sans-serif" font-size="18">and maps API responses to MCP.</text>
    <rect x="650" y="474" width="112" height="34" rx="17" fill="#174e61"/>
    <rect x="775" y="474" width="94" height="34" rx="17" fill="#174e61"/>
    <rect x="882" y="474" width="91" height="34" rx="17" fill="#174e61"/>
    <text x="706" y="497" text-anchor="middle" fill="#a9eee7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">SEARCH</text>
    <text x="822" y="497" text-anchor="middle" fill="#a9eee7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">DETAILS</text>
    <text x="927" y="497" text-anchor="middle" fill="#a9eee7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">LINKS</text>
  </g>

  <g>
    <path d="M1028 387h108" stroke="#63d5ca" stroke-width="4" stroke-linecap="round"/>
    <path d="m1118 371 20 16-20 16" fill="none" stroke="#63d5ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1058" y="357" fill="#8fded7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">BEARER</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1158" y="260" width="360" height="254" rx="22" fill="#f6fbff"/>
    <rect x="1158" y="260" width="8" height="254" rx="4" fill="#f3b562"/>
    <circle cx="1213" cy="318" r="25" fill="#fff0d7"/>
    <path d="M1200 325h26M1204 316h18M1208 307h10" stroke="#bd7421" stroke-width="4" stroke-linecap="round"/>
    <text x="1256" y="311" fill="#bd7421" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">JOB SEARCH API</text>
    <text x="1194" y="371" fill="#09233d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Public job data</text>
    <text x="1194" y="404" fill="#09233d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">and access control</text>
    <text x="1194" y="452" fill="#46627d" font-family="Arial, Helvetica, sans-serif" font-size="18">Application links require</text>
    <text x="1194" y="478" fill="#46627d" font-family="Arial, Helvetica, sans-serif" font-size="18">scope plus active subscription</text>
  </g>

  <g>
    <rect x="82" y="604" width="1436" height="76" rx="18" fill="#0c3046" stroke="#2e6b79" stroke-opacity="0.7"/>
    <circle cx="123" cy="642" r="9" fill="#31c8b8"/>
    <text x="148" y="649" fill="#d9f4f0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Public by default</text>
    <text x="343" y="649" fill="#a8c5d2" font-family="Arial, Helvetica, sans-serif" font-size="19">Search and details never expose original application URLs</text>
    <circle cx="1055" cy="642" r="9" fill="#f3b562"/>
    <text x="1080" y="649" fill="#d9f4f0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Protected when it matters</text>
  </g>
</svg>
